<script>
const A = __ASSETS_JSON__;
(() => {
'use strict';
/* =============== CONSTANTS =============== */
const TS=32, VW=800, VH=448, GR=11, GY=GR*TS, PW=20, PH=28;
const GRAV=1500, JUMP=-520, RUN=205, ACC=1500, FRIC=1700, AIRACC=1100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pickW=(arr,r)=>{let s=0;for(const a of arr)s+=a[1];let v=r()*s;for(const a of arr){v-=a[1];if(v<=0)return a[0]}return arr[0][0]};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);

/* =============== SETTINGS / STORAGE =============== */
const S={sfx:true,music:true,voice:true,dialect:'mix',best:1,deaths:0,hero:'falafel',look3d:true,diff:'crazy',qm:'auto',q:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('td_s')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('td_s',JSON.stringify(S))}catch(e){}};

/* =============== TEXT DATA =============== */
const DL={sy:'شامي',eg:'مصري',gulf:'خليجي',iq:'عراقي',ma:'مغربي',lb:'لبناني',ps:'فلسطيني',any:'فصحى مضحكة',en:'English'};
/* voices manifest: every entry has text (always usable as a subtitle); audio is optional and decoded lazily */
const VO=A.voices||{}, hasAud=k=>!!(A.audio&&A.audio[k]);
const byKind={}; for(const k of Object.keys(VO)){(byKind[VO[k].k]||(byKind[VO[k].k]=[])).push(k)}
const REC_OK=['lb','eg','ps'], REC={}; for(const k of Object.keys(VO)){ if(VO[k].k==='taunt'&&hasAud(k))REC[VO[k].d]=(REC[VO[k].d]||0)+1 }
/* a dialect with almost no recordings (sy / gulf / iq / ma) would repeat the same 1-2 clips forever: borrow recorded lines from lb / eg / ps instead (the caption shows what is actually said) */
const isSparse=d=>d!=='mix'&&d!=='all'&&!REC_OK.includes(d)&&(REC[d]||0)<6;
const seenBag={};
function bagPick(ctx,items,id){            // shuffle-bag: no repeats until everything was used once
  if(!items.length)return null;
  const s=seenBag[ctx]||(seenBag[ctx]=new Set()); let pool=items.filter(x=>!s.has(id(x)));
  if(!pool.length){const last=[...s].pop();s.clear();pool=items.filter(x=>id(x)!==last);if(!pool.length)pool=items}
  const x=rnd(pool); s.add(id(x)); return x;
}
/* kind = taunt | c_<cause> | streak | quick | near | win | intro | level | milestone | idle | fake | bait
   opts: legacy (text-only [text,dialect] list), pAudio (chance to prefer an item that has a recorded voice), lv (milestone) */
function pick(kind,o){
  o=o||{};
  let items=(byKind[kind]||[]).map(k=>({id:k,t:VO[k].t,d:VO[k].d,aud:hasAud(k),lv:VO[k].lv})).filter(x=>diaOK(x.d));
  if(isSparse(S.dialect)) for(const k of (byKind[kind]||[])){ if(hasAud(k)&&REC_OK.includes(VO[k].d)&&!items.some(x=>x.id===k)) items.push({id:k,t:VO[k].t,d:VO[k].d,aud:true,lv:VO[k].lv}) }
  if(o.lv!=null)items=items.filter(x=>x.lv===o.lv);
  if(o.legacy)items=items.concat(o.legacy.filter(l=>diaOK(l[1])).map(l=>({id:'L:'+l[0],t:l[0],d:l[1],aud:false})));
  if(!items.length)return null;
  const withA=items.filter(x=>x.aud), txt=items.filter(x=>!x.aud);
  const wantA=!o.noAudio&&S.voice&&withA.length>0&&Math.random()<(o.pAudio==null?.92:o.pAudio);
  const pool=wantA?withA:(txt.length?txt:items);
  const x=bagPick(kind+(o.lv==null?'':o.lv)+(wantA?'A':'T'),pool,y=>y.id);
  return Object.assign({play:wantA},x);
}
function sayVoice(x,dur,o){ if(!x)return; if(typeof o==='number')o={delay:o}; if(x.play)Snd.voice(x.id,o); say(x.t,x.d,dur||2.6) }
function laughFx(delay){          // taunt without a recorded voice: recorded laugh if we have one (and nobody is speaking), else the synth jingle
  const lk=(byKind.laugh||[]).filter(hasAud);
  if(S.voice&&lk.length&&Math.random()<.55)Snd.voice(bagPick('laughclip',lk,x=>x),{pri:2,delay:delay||0,max:1.8,wait:0});
  else{ setTimeout(()=>{ if(!Snd.voiceBusy())Snd.trombone() },(delay||0)*1000); setTimeout(()=>{ if(!Snd.voiceBusy())Snd.laugh() },(delay||0)*1000+500) }
}
/* ---- hero voice: every hero speaks in HIS own accent (independent of the dialect setting). The text bubble above his head always shows;
   the voice plays only for lines that have a recording. ev = pick | die | run | win | warn ---- */
const heroCd={}; let hlblT=0;
function heroSay(ev,o){
  o=o||{}; if(SIM)return null;
  const tn=performance.now(); if(!o.force&&(heroCd[ev]||0)>tn)return null;
  const all=(byKind['h_'+ev]||[]).filter(k=>VO[k].h===S.hero); if(!all.length)return null;
  const wA=S.voice?all.filter(hasAud):[], id=bagPick('h:'+S.hero+':'+ev,wA.length?wA:all,k=>k), aud=!!(S.voice&&hasAud(id));
  heroCd[ev]=tn+(o.cd||0)*1000;
  if(!o.noBubble)G.hsay={txt:VO[id].t,t:o.dur||2.2,t0:o.dur||2.2};
  if(aud)Snd.voice(id,{pri:o.pri==null?2:o.pri,delay:o.delay||0,max:o.max,wait:o.wait==null?.4:o.wait,ttl:o.ttl==null?1.2:o.ttl});
  return {id,t:VO[id].t,aud};
}
function heroSelectSay(){         // picking a hero in the menu: he greets you (voice) and the caption above the row shows what he said
  const r=heroSay('pick',{force:1,noBubble:1,pri:5,delay:.05,ttl:.5,wait:0}); if(!r)return;
  document.querySelectorAll('.hlbl').forEach(el=>{ if(el.dataset.o==null)el.dataset.o=el.textContent; el.textContent='💬 '+r.t });
  clearTimeout(hlblT); hlblT=setTimeout(()=>document.querySelectorAll('.hlbl').forEach(el=>{el.textContent=el.dataset.o}),2800);
}
const DEATH_LINES={
 spike:[['شو هاد؟ صرت سيخ شاورما!','sy'],['الأشواك عم تقلّك: أهلاً وسهلاً!','sy'],['رجليك مش للزينة يا باشا، اقفز!','eg'],['شكلك جاي تاخد مساج بالشوك!','lb'],['ثقبوك مثل الغربال يا شيخ!','gulf'],['آ صاحبي حلّ عينيك، الشوك ماشي ديكور!','ma'],['ولك هاي شوك مو مخدّة!','iq'],['يا زلمة الشوك مو مخدّة للنوم!','ps']],
 pit:[['الجاذبية: 1 — أنت: 0','any'],['سقطت سقطة الأبطال... بس ما كانت بطولة!','any'],['يا لطيف شو هالطيران! بس الهبوط كان سيء','lb'],['ما حدا قلّك إن الحفرة مش مخدّة هوا؟','ps'],['إيه ده؟ الأرض اختفت؟ ما تقولش!','eg'],['طحت يا شيخ، الله يعوّضك','gulf'],['شلون وقعت بهالحفرة الواضحة؟','iq'],['الحفرة كانت تناديك من بدري!','sy']],
 crumble:[['الأرض خانتك... كالعادة!','sy'],['ما قلتلك ما توقف؟','ps'],['الأرض كانت كرتونة يا شيخ','gulf'],['انهارت الأرض وانهارت معاها أحلامك','eg'],['حتى الأرض فقدت الثقة فيك','any']],
